name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    name: Coding style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Check changed JavaScript and TypeScript
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            BASE_REF=$(git rev-list --max-parents=0 HEAD | head -n 1)
          fi
          bun run check:style --changed --since "$BASE_REF" --no-errors-on-unmatched

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check Compose configuration
        run: |
          docker compose -f compose.dev.yml config --quiet
          docker compose -f compose.yml config --quiet
      - name: Build image
        run: docker build --tag framedock:ci .
      - name: Check UI, preview relay, and saved workspace
        run: bash scripts/smoke-test.sh framedock:ci
